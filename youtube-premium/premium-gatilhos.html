#info{position:fixed;inset:0}
#info svg{display:block}
#tip{position:fixed;z-index:5;pointer-events:none;background:#111;color:#FFFFFF;font:600 12px/1.45 'Inter',system-ui,sans-serif;padding:8px 10px;border-radius:2px;max-width:240px}

<title>Gatilhos · YouTube Premium</title></head><body>
<div id="info"></div><div id="tip" hidden></div>
<script>
// Infográficos do listening — SVG responsivo que sempre cabe na janela (sem rolagem)
(function(){
const C={paper:'#FFFFFF',ink:'#111111',red:'#E8352C',blue:'#1F5BFF',grey:'#8A867D',rule:'#CFCAC0'};
const DISP="'Inter Tight','Inter',system-ui,sans-serif", MONO="'IBM Plex Mono','DejaVu Sans Mono',monospace", BODY="'Inter',system-ui,sans-serif";
const NS='http://www.w3.org/2000/svg';
function el(t,a,p){const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);if(p)p.appendChild(e);return e}
function txt(p,x,y,s,o){const t=el('text',Object.assign({x,y},o),p);t.textContent=s;return t}
function lines(p,x,y,arr,o,lh){arr.forEach((s,i)=>txt(p,x,y+i*lh,s,o))}

window.renderInfo=function(D){
  const root=document.getElementById('info'); const tip=document.getElementById('tip');
  function draw(){
    root.innerHTML='';
    const W=window.innerWidth,H=window.innerHeight;
    const svg=el('svg',{width:W,height:H,viewBox:`0 0 ${W} ${H}`,role:'img','aria-label':D.aria},root);
    el('rect',{x:0,y:0,width:W,height:H,fill:C.paper},svg);
    const compact=W<620, tiny=H<380, mid=W<1200;
    const pad=Math.max(14,Math.min(W*0.035,40));
    const s=Math.max(0.62,Math.min(W/1100,H/700,1.25));
    let y=pad;
    const kf=Math.max(9,11*s);
    const avail=W-2*pad;
    {const ko={fill:C.red,'font-family':MONO,'font-size':kf,'font-weight':700,'letter-spacing':'0.04em'};
     let kt=txt(svg,pad,y+kf,compact?D.kickerShort:D.kicker,ko);
     if(kt.getComputedTextLength()>avail&&D.kickerShort&&!compact){kt.remove();kt=txt(svg,pad,y+kf,D.kickerShort,ko)}
     const kl=kt.getComputedTextLength(); if(kl>avail)kt.setAttribute('font-size',kf*avail/kl*0.98);}
    y+=kf+8*s;
    let hf=Math.max(19,Math.min(44*s,W*(compact?0.075:0.045)));
    const hl=compact?D.headShort:D.head;
    {const probe=hl.map(t=>txt(svg,0,-100,t,{'font-family':DISP,'font-size':hf,'font-weight':900,'letter-spacing':'-0.02em'}));
     const mw=Math.max(...probe.map(t=>t.getComputedTextLength())); probe.forEach(t=>t.remove()); if(mw>avail)hf=hf*avail/mw*0.98;}
    txt(svg,pad,y+hf*0.9,hl[0],{fill:C.ink,'font-family':DISP,'font-size':hf,'font-weight':900,'letter-spacing':'-0.02em'});
    y+=hf*1.08;
    if(hl[1]){txt(svg,pad,y+hf*0.9,hl[1],{fill:C.grey,'font-family':DISP,'font-size':hf,'font-weight':900,'letter-spacing':'-0.02em'});y+=hf*1.08}
    const showDeck=!tiny&&H>460;
    if(showDeck){const df=Math.max(11,13*s);y+=6*s;
      const src=compact?D.deckShort:D.deck, o={fill:C.ink,'font-family':BODY,'font-size':df}, out=[];
      src.forEach(par=>{const words=par.split(' ');let cur='';const pr=txt(svg,0,-100,'',o);
        words.forEach(w=>{const t=cur?cur+' '+w:w;pr.textContent=t;if(pr.getComputedTextLength()>avail&&cur){out.push(cur);cur=w}else cur=t});
        if(cur)out.push(cur);pr.remove();});
      lines(svg,pad,y+df,out,o,df*1.4);y+=df*1.4*out.length}
    y+=10*s;
    const kN=D.kpis.length, kw=(W-2*pad)/kN, nf=Math.max(18,Math.min(30*s,kw*0.28)), lf=Math.max(8.5,9.5*s);
    D.kpis.forEach((k,i)=>{const x=pad+i*kw;
      el('rect',{x,y,width:kw-10*s,height:3,fill:k.c},svg);
      txt(svg,x,y+8+nf,k.n,{fill:k.c,'font-family':DISP,'font-size':nf,'font-weight':900,'letter-spacing':'-0.02em'});
      txt(svg,x,y+8+nf+lf+5,(W<1000)?k.ls:k.l,{fill:C.ink,'font-family':MONO,'font-size':lf,'font-weight':700});});
    y+=8+nf+lf+5+14*s;
    const gf=Math.max(8.5,9.5*s); let gx=pad;
    ((compact&&D.legendShort)?D.legendShort:D.legend).forEach(g=>{const t=txt(svg,gx,y+gf,g.t,{fill:g.c,'font-family':MONO,'font-size':gf,'font-weight':700});gx+=t.getComputedTextLength()+16*s});
    if(D.axisNote&&W>=1000)txt(svg,W-pad,y+gf,D.axisNote,{fill:C.grey,'font-family':MONO,'font-size':gf*0.9,'text-anchor':'end'});
    y+=gf+6*s;
    const foot=Math.max(9,9*s)*2*1.5+8;
    const evRoom=2*Math.max(8,9*s)*1.25+10;
    const top=y+evRoom, bottom=H-pad-foot-Math.max(10,11*s)-6;
    const left=pad+(D.yLeft?Math.max(26,34*s):0), right=W-pad-(D.yRight?Math.max(30,40*s):0);
    const cw=right-left, ch=Math.max(60,bottom-top);
    D.chart({svg,left,right,top,bottom:top+ch,cw,ch,s,compact,C,MONO,DISP,BODY,el,txt,tip,W,H});
    const ff=Math.max(8,8.5*s);
    {const fo={fill:C.grey,'font-family':MONO,'font-size':ff};let useShort=mid;
     if(!useShort){const pr=txt(svg,0,-100,D.foot,fo);if(pr.getComputedTextLength()>avail)useShort=true;pr.remove()}
     const fl=useShort?D.footShort:[D.foot];
     const ts=fl.map((t,i)=>txt(svg,pad,H-pad-(fl.length-1-i)*ff*1.5,t,fo));
     const mw=Math.max(...ts.map(t=>t.getComputedTextLength()));if(mw>avail)ts.forEach(t=>t.setAttribute('font-size',ff*avail/mw*0.98));}
  }
  draw(); let t; window.addEventListener('resize',()=>{clearTimeout(t);t=setTimeout(draw,80)});
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(draw);
};
window.showTip=function(tip,html,x,y){tip.innerHTML=html;tip.hidden=false;const r=tip.getBoundingClientRect();let L=x+12,T=y-r.height-10;if(L+r.width>innerWidth-6)L=x-r.width-12;if(L<6)L=6;if(T<6)T=y+14;tip.style.left=L+'px';tip.style.top=T+'px'};
})();
</script>
<script>
function placeEvents(g,ev,xs,yTop,P,valY){
  const f=Math.max(8,9*P.s), lh=f*1.25, ends=[-1e9,-1e9];
  ev.forEach(e=>{const x=xs(e.i), lab=P.compact?e.short:e.long;
    const w=lab.length*f*0.62; let r=1; if(x-w/2<ends[1]+8){r=0} if(r===0&&x-w/2<ends[0]+8){r=1}
    ends[r]=x+w/2; const ty=yTop-(r?0:lh);
    let ax='middle',tx=x; if(x+w/2>P.W-6){ax='end';tx=x+4} if(x-w/2<6){ax='start';tx=x-4}
    P.el('line',{x1:x,x2:x,y1:ty+3,y2:Math.max(ty+4,valY(e.i)-5),stroke:P.C.ink,'stroke-width':0.7,'stroke-dasharray':'1 2'},g);
    P.txt(g,tx,ty,lab,{fill:P.C.ink,'font-family':P.MONO,'font-size':f,'font-weight':700,'text-anchor':ax});
  });
}
</script>
<script>
// DADOS: gatilhos que empurram para assinar ou para sair do Premium, 16/10/2025 a 16/10/2026. k = marco-chave; br = recorte Brasil; e = data final
const T0=Date.UTC(2025,9,16), T1=Date.UTC(2026,9,16);
const d=s=>{const [a,b,c]=s.split('/');return Date.UTC(+c,+b-1,+a)};
const LANES=[{k:'A',n:'PRESSÃO SOBRE O GRÁTIS',ns:'GRÁTIS',c:'#E8352C'},{k:'P',n:'ATRITOS DO PREMIUM',ns:'ATRITOS',c:'#111111'},{k:'S',n:'PRODUTO E OFERTAS',ns:'PRODUTO',c:'#7B3FE4'},{k:'N',n:'NEGÓCIO E AUDIÊNCIA',ns:'NEGÓCIO',c:'#1F5BFF'}];
const EV=[
{l:'A',t:'27/11/2025',s:'SmartTube comprometido',ss:'SmartTube',x:'APK oficial do SmartTube (app alternativo para TV) é comprometido com malware; Google e Amazon removem o app dos aparelhos.'},
{l:'A',t:'26/01/2026',s:'"Content isn\'t available"',ss:'Erro',x:'Erro em massa ligado a bloqueadores; atinge também assinantes. Tecnoblog: "YouTube volta a falhar para quem usa bloqueador".',br:1},
{l:'A',t:'28/01/2026',s:'Fim do 2º plano grátis',ss:'2º plano',x:'Reprodução em segundo plano deixa de funcionar em Samsung Internet, Edge, Brave e Vivaldi; Google confirma que é recurso do Premium.',k:1},
{l:'A',t:'02/03/2026',s:'Não pulável de 30 s na TV',ss:'30 s TV',x:'Formato não pulável de até 30 s no app de TV, global. No Brasil, o Google diz que só o Premium desativa o formato.',k:1,br:1},
{l:'A',t:'07/04/2026',s:'Relatos de 90 s',ss:'90 s',x:'Usuários relatam blocos de ~90 s não puláveis na TV; YouTube diz que investiga e que não era intencional. Xataka BR: "cada vez mais parecido com TV aberta".',k:1,br:1},
{l:'P',t:'01/10/2025',s:'Família suspenso (BR)',ss:'Família',x:'Reclame Aqui (Recife): plano família suspenso por "acesso em diferentes localidades". Regra da mesma casa chega ao Brasil.',br:1},
{l:'P',t:'01/03/2026',s:'Benefício TIM suspenso',ss:'TIM',x:'Reclame Aqui: Premium do TIM Black Família suspenso; outras queixas de cobrança após promoções de operadoras (TIM, Vivo).',br:1},
{l:'P',t:'10/04/2026',s:'Reajuste nos EUA',ss:'EUA',x:'Individual US$ 13,99 → 15,99; Família 22,99 → 26,99; Lite 7,99 → 8,99. YouTube: "não há atualizações específicas para o Brasil".',k:1},
{l:'P',t:'14/07/2026',s:'Ação: "ad-free" com patrocínio',ss:'Ação',x:'Ação coletiva nos EUA (e depois no Canadá, 21/08) alega que o "sem anúncios" engana porque patrocínios seguem nos vídeos.',k:1},
{l:'P',t:'16/07/2026',s:'Família: checagem periódica',ss:'Checagem',x:'Fast Company Brasil: a plataforma "pode solicitar verificações periódicas" de endereço no plano família.',br:1},
{l:'P',t:'21/08/2026',s:'Reajuste Europa (opt-in)',ss:'Europa',x:'Alta em parte da Europa e em Singapura; na UE, quem não aceitar o novo preço até 10/10 perde a assinatura.'},
{l:'S',t:'24/02/2026',s:'Lite ganha 2º plano e downloads',ss:'Lite+',x:'Premium Lite (R$ 16,90 no Brasil) passa a ter segundo plano e downloads (exceto música e Shorts); disponível no Brasil.',k:1,br:1},
{l:'S',t:'15/05/2026',s:'Itaú oferece Lite',ss:'Itaú',x:'Itaú libera meses de Premium Lite (e Premium para Uniclass/Personnalité) como benefício a correntistas.',br:1},
{l:'S',t:'29/05/2026',s:'Podcasts: "super-users"',ss:'Podcast',x:'YouTube: assinantes Premium viram mais de 800 mi de horas de podcast em abril; ganham On-the-go mode e velocidade automática.',k:1},
{l:'S',t:'13/06/2026',s:'Vivo Easy com Premium',ss:'Vivo',x:'Plano de R$ 40/mês (anual) da Vivo Easy inclui o YouTube sem anúncios; criadores divulgam como "de graça".',br:1},
{l:'S',t:'28/07/2026',s:'Peacock no Premium (EUA)',ss:'Peacock',x:'Peacock Premium incluído no YouTube Premium nos EUA a partir de 2027; leitores temem novo reajuste.'},
{l:'N',t:'29/10/2025',s:'3T25: 300 mi de assinaturas',ss:'3T25',x:'Google passa de 300 mi de assinaturas pagas em todos os serviços.'},
{l:'N',t:'17/01/2026',s:'Kantar: 21,6% da TV',ss:'Kantar',x:'Dez/25: YouTube tem 21,6% do tempo de tela da TV nos lares brasileiros, a maior fatia individual de vídeo online.',k:1,br:1},
{l:'N',t:'05/02/2026',s:'YouTube > US$ 60 bi',ss:'US$60bi',x:'Receita 2025 acima de US$ 60 bi; MBW estima ~US$ 20 bi em assinaturas.'},
{l:'N',t:'30/04/2026',s:'Recorde de assinantes',ss:'Recorde',x:'1T26: Music e Premium têm a maior alta trimestral de assinantes não-trial desde 2018.',k:1},
{l:'N',t:'11/06/2026',e:'19/07/2026',s:'Copa na CazéTV',ss:'Copa',x:'Pico acima de 23 mi de aparelhos simultâneos na final; mais de 70% do consumo na TV conectada.',br:1},
{l:'N',t:'22/07/2026',s:'Assinaturas > anúncios',ss:'Assin.',x:'2T26: Schindler diz que assinaturas crescem mais rápido que anúncios, puxadas por Music e Premium.'},
{l:'N',t:'07/10/2026',s:'Brandcast Brasil',ss:'BC BR',x:'130 mi de adultos alcançados, mais de 90 mi na TV conectada. Nenhum dado de Premium divulgado.',k:1,br:1},
];
const MOTE=[{a:'16/10/2025',b:'02/03/2026',t:'CERCO AO ADBLOCK',ts:'ADBLOCK'},{a:'02/03/2026',b:'10/04/2026',t:'30 s NA TV',ts:'TV'},{a:'10/04/2026',b:'16/10/2026',t:'REAJUSTES FORA · BRASIL SEGUE EM R$ 26,90',ts:'REAJUSTES'}];
const MES=['OUT/25','NOV','DEZ','JAN/26','FEV','MAR','ABR','MAI','JUN','JUL','AGO','SET','OUT/26'];
const MS=['O','N','D','J','F','M','A','M','J','J','A','S','O'];
renderInfo({aria:'Linha do tempo dos gatilhos para assinar ou sair do YouTube Premium, de outubro de 2025 a outubro de 2026',
 kicker:'LISTENING / YOUTUBE PREMIUM · HEAVY USERS / GATILHOS DO ANO / OUT 2025 – OUT 2026', kickerShort:'YT PREMIUM / GATILHOS',
 head:['O grátis ficou mais caro de usar.','O Premium, mais caro fora do Brasil.'], headShort:['O grátis piorou;','o Premium encareceu lá fora.'],
 deck:['O ano fechou brechas do grátis (segundo plano no navegador, bloqueadores, 30 s não puláveis na TV) enquanto o Premium subiu nos EUA e na Europa. No Brasil, o preço segue o de abr/25.','Marcos-chave em círculo cheio; anel azul = recorte Brasil. Toque em um ponto para ver o detalhe.'],
 deckShort:['Brechas do grátis fecharam; preço do BR','segue o de abr/25. Toque nos pontos.'],
 kpis:[{n:'23',l:'MARCOS MAPEADOS',ls:'MARCOS',c:'#111111'},{n:'10',l:'MARCOS-CHAVE',ls:'CHAVE',c:'#E8352C'},{n:'12',l:'COM RECORTE BRASIL',ls:'BRASIL',c:'#1F5BFF'},{n:'R$ 26,90',l:'INDIVIDUAL NO BR DESDE ABR/25',ls:'BR DESDE ABR/25',c:'#7B3FE4'}],
 legend:[{t:'● MARCO-CHAVE',c:'#111111'},{t:'○ MARCO',c:'#8A867D'},{t:'◎ RECORTE BRASIL',c:'#1F5BFF'},{t:'▬ PERÍODO',c:'#8A867D'}],
 legendShort:[{t:'● CHAVE',c:'#111111'},{t:'○ MARCO',c:'#8A867D'},{t:'◎ BRASIL',c:'#1F5BFF'}],
 axisNote:'', yLeft:false, yRight:false,
 foot:'FONTE: EUPHORIA CREATIVE · imprensa (Tecnoblog, Canaltech, Olhar Digital, Xataka, 9to5Google, Android Authority, MBW, Tubefilter), Reclame Aqui e canais oficiais. Seleção editorial. Out/26 parcial (até 16/10).',
 footShort:['FONTE: EUPHORIA · imprensa, Reclame Aqui e canais oficiais;','seleção editorial. Out/26 parcial.'],
 chart(P){
  const {svg,top,bottom,ch,s,compact,C,MONO,DISP,BODY,el,txt,tip,W}=P;
  const g=el('g',{},svg); const f=Math.max(8,(compact?8:9.5)*s); const af=Math.max(8,8.5*s);
  const labW=compact?Math.max(44,52*s):Math.max(96,120*s);
  const left=P.left+labW, right=P.right-4, cw=right-left;
  const X=t=>left+cw*Math.min(1,Math.max(0,(t-T0)/(T1-T0)));
  // faixa de mote
  const mh=Math.max(14,18*s); const my=top;
  MOTE.forEach((m,i)=>{const x1=X(d(m.a)),x2=X(d(m.b));el('rect',{x:x1,y:my,width:x2-x1-2,height:mh,fill:i==2?'#E8352C':(i==1?'#111111':'#CFCAC0')},g);
    const lab=compact?m.ts:m.t; const tt=txt(g,x1+5,my+mh*0.7,lab,{fill:i==0?'#111111':'#FFFFFF','font-family':MONO,'font-size':af,'font-weight':700});
    if(tt.getComputedTextLength()>x2-x1-10)tt.remove()});
  txt(g,P.left,my+mh*0.7,'FASE',{fill:C.grey,'font-family':MONO,'font-size':af,'font-weight':700});
  const axisH=af+10; const ly0=my+mh+8, ly1=bottom-axisH; const lh=(ly1-ly0)/LANES.length;
  // grade mensal
  for(let i=0;i<13;i++){const t=Date.UTC(2025,9+i,1);const x=i==0?left:X(t);
    el('line',{x1:x,x2:x,y1:ly0,y2:ly1,stroke:C.rule,'stroke-width':0.6},g);
    const mid=i==12?(x+right)/2:(x+X(Date.UTC(2025,10+i,1)))/2;
    txt(g,i==0?(left+X(Date.UTC(2025,10,1)))/2:mid,ly1+af+6,(cw/12<46)?MS[i]:MES[i],{fill:C.ink,'font-family':MONO,'font-size':af,'text-anchor':'middle'})}
  const r=Math.max(3.5,(compact?4:5.5)*s), lineH=f*1.35;
  LANES.forEach((L,li)=>{const y0=ly0+li*lh, yc=y0+lh*0.5;
    if(li%2==0)el('rect',{x:P.left,y:y0,width:right-P.left,height:lh,fill:'#F4F2EE'},g);
    el('rect',{x:P.left,y:y0+4,width:3,height:lh-8,fill:L.c},g);
    const nf=Math.max(8.5,(compact?8.5:10.5)*s);
    const words=(compact?L.ns:L.n).split(' ');
    if(!compact&&words.length>2){txt(g,P.left+9,yc-2,words.slice(0,-2).join(' '),{fill:L.c,'font-family':MONO,'font-size':nf,'font-weight':700});txt(g,P.left+9,yc-2+nf*1.2,words.slice(-2).join(' '),{fill:L.c,'font-family':MONO,'font-size':nf,'font-weight':700})}
    else txt(g,P.left+9,yc+nf*0.35,compact?L.ns:L.n,{fill:L.c,'font-family':MONO,'font-size':nf,'font-weight':700});
    el('line',{x1:left,x2:right,y1:yc,y2:yc,stroke:L.c,'stroke-width':1,opacity:0.35},g);
    // rótulos: linhas acima e abaixo do eixo da faixa
    const slots=[], nRows=Math.max(1,Math.floor((lh/2-r-2)/lineH));
    for(let k=0;k<nRows;k++){slots.push({y:yc-r-4-k*lineH,end:-1e9});slots.push({y:yc+r+4+f+k*lineH,end:-1e9})}
    EV.filter(e=>e.l==L.k).sort((a,b)=>d(a.t)-d(b.t)).forEach(e=>{
      const x=X(d(e.t));
      if(e.e){el('rect',{x,y:yc-r*0.6,width:Math.max(2,X(d(e.e))-x),height:r*1.2,fill:L.c,opacity:0.45,rx:r*0.6},g)}
      const c=el('circle',{cx:x,cy:yc,r:e.k?r*1.15:r,fill:e.k?L.c:'#FFFFFF',stroke:L.c,'stroke-width':1.6},g);
      if(e.br)el('circle',{cx:x,cy:yc,r:(e.k?r*1.15:r)+3,fill:'none',stroke:'#1F5BFF','stroke-width':1.8},g);
      const lab=(compact?e.ss:e.s); const fs=e.k?f:f*0.92;
      const tmp=txt(g,0,-100,lab,{'font-family':BODY,'font-size':fs,'font-weight':e.k?700:600}); const w=tmp.getComputedTextLength(); tmp.remove();
      let tx=x-r; if(tx+w>right)tx=right-w;
      const sl=slots.find(q=>tx>q.end+6);
      if(sl){txt(g,tx,sl.y,lab,{fill:e.k?C.ink:'#55524C','font-family':BODY,'font-size':fs,'font-weight':e.k?700:600});sl.end=tx+w;
        if(Math.abs(sl.y-yc)>lineH*1.2)el('line',{x1:x,x2:x,y1:sl.y<yc?sl.y+3:sl.y-f,y2:sl.y<yc?yc-r:yc+r,stroke:L.c,'stroke-width':0.6,'stroke-dasharray':'1 2'},g)}
      const hit=el('circle',{cx:x,cy:yc,r:Math.max(12,r*2.5),fill:'transparent'},g);
      const h=ev=>{const p=ev.touches?ev.touches[0]:ev;showTip(tip,`<b>${e.t}${e.e?' – '+e.e:''} · ${L.n}</b><br>${e.s}${e.br?' 🇧🇷':''}<br>${e.x}`,p.clientX,p.clientY)};
      hit.addEventListener('mousemove',h);hit.addEventListener('touchstart',h,{passive:true});hit.addEventListener('mouseleave',()=>tip.hidden=true);
    });
  });
 }});
</script>
